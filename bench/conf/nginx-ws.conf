# nginx under test for ws.sh: one worker, WebSocket tunnels on :19180.
worker_processes 1;
worker_rlimit_nofile 1000000;
daemon off;
pid RUN/nginx.pid;
error_log stderr error;
events { worker_connections 300000; }
http {
    access_log off;
    upstream app { server 127.0.0.1:19191; server 127.0.0.1:19192; server 127.0.0.1:19193; server 127.0.0.1:19194; }
    server {
        listen 127.0.0.1:19180;
        location /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Tunnels idle through the hold phase.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
