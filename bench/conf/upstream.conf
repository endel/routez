# The upstream all three proxies share, on its own cores.
#   19090-19097  plain "pong"; 19090 alone is the single-server upstream, all
#                eight are the load-balancing rows
#   19098        the same over TLS
#   19099        a 1 MB file
#   19100        100 KB of text, for compressing a proxied response
#   19101        "pong" on every 127.0.0.x, for the row that opens a new
#                upstream connection per request: one address would run out of
#                ephemeral ports long before the server ran out of speed
worker_processes UPSTREAM_WORKERS;
daemon off;
pid RUN/upstream.pid;
error_log stderr error;
events { worker_connections 20000; }
http {
    access_log off;
    default_type text/plain;
    keepalive_requests 100000;
    # The upload row sends 1 MB bodies; nginx discards them at `return`.
    client_max_body_size 8m;

    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve X25519;
    ssl_certificate CERTS/server.crt;
    ssl_certificate_key CERTS/server.key;

    # Serves a real file when the path names one (the layer-4 bulk row) and
    # "pong" otherwise (every proxied row, whose paths are not files).
    server {
        listen 127.0.0.1:19090 reuseport;
        root WWW;
        location / { try_files $uri @pong; }
        location @pong { return 200 "pong"; }
    }
    server { listen 127.0.0.1:19091; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19092; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19093; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19094; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19095; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19096; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19097; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19098 ssl; location / { return 200 "pong"; } }
    server { listen 0.0.0.0:19101; location / { return 200 "pong"; } }
    server { listen 127.0.0.1:19099; root WWW; location / { try_files /1m.bin =404; } }
    server { listen 127.0.0.1:19100; root WWW; location / { try_files /z/text.html =404; } }
}
