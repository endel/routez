# HAProxy under test for ws.sh: one thread, WebSocket tunnels on :19182.
global
    nbthread 1
    maxconn 300000

defaults
    mode http
    maxconn 300000
    timeout connect 5s
    timeout client 75s
    timeout server 60s
    # Tunnels idle through the hold phase.
    timeout tunnel 1h

frontend fe
    bind 127.0.0.1:19182 backlog 1024  # routez listens with 1024
    default_backend app

backend app
    balance roundrobin
    server a1 127.0.0.1:19191
    server a2 127.0.0.1:19192
    server a3 127.0.0.1:19193
    server a4 127.0.0.1:19194
