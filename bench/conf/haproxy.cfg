# HAProxy under test: plain on :19082, TLS on :19445. Not a file server, so it
# sits out the static-file rows.
global
    nbthread WORKERS
    maxconn 200000
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-curves X25519
    # The access-log rows need a target; `no log` in defaults turns it off again.
    log stdout format raw daemon

defaults
    mode http
    timeout connect 5s
    timeout client 75s
    timeout server 60s
    timeout http-keep-alive 75s
    HAPROXY_LOG

frontend fe
    # One listener per thread, like SO_REUSEPORT per worker in the others.
    bind 127.0.0.1:19082 shards by-thread
    bind 127.0.0.1:19445 ssl crt RUN/server.pem alpn http/1.1 shards by-thread

    # A rate limit that is on but never fires, and an allow list that always
    # allows: what the check itself costs.
    stick-table type ip size 1m expire 10s store http_req_rate(10s)
    http-request track-sc0 src if { path_beg /lr/ }
    http-request deny deny_status 429 if { path_beg /lr/ } { sc_http_req_rate(0) gt 20000000 }
    http-request deny unless { path_beg /acl/ } || { src 127.0.0.0/8 }
    http-request set-path /ping if { path_beg /rw/ }

    http-request return status 200 content-type text/plain string pong if { path /ping }
    http-request return status 200 content-type text/plain string pong if { path_beg /lr/ }
    http-request return status 200 content-type text/plain string pong if { path_beg /acl/ }
    use_backend be1m  if { path_beg /up1m/ }
    use_backend bez   if { path_beg /upz/ }
    use_backend betls if { path_beg /ups/ }
    use_backend be8lc if { path_beg /up8lc/ }
    use_backend be8   if { path_beg /up8/ }
    use_backend benk  if { path_beg /nk/ }
    use_backend be    if { path_beg /up/ }
    # ROUTING

backend be
    http-reuse always
    server up 127.0.0.1:19090
backend be1m
    http-reuse always
    server up 127.0.0.1:19099
backend bez
    http-reuse always
    compression algo gzip
    compression type text/html
    server up 127.0.0.1:19100
backend betls
    http-reuse always
    server up 127.0.0.1:19098 ssl verify none
backend benk
    # A fresh upstream connection per request. `http-reuse never` is not enough:
    # it only stops sharing between sessions, and one wrk connection is one
    # session, so it would still reuse. Closing the server side does force it.
    option http-server-close
    server s1 127.0.0.1:19101
    server s2 127.0.0.2:19101
    server s3 127.0.0.3:19101
    server s4 127.0.0.4:19101
    server s5 127.0.0.5:19101
    server s6 127.0.0.6:19101
    server s7 127.0.0.7:19101
    server s8 127.0.0.8:19101
backend be8
    balance roundrobin
    http-reuse always
    server s1 127.0.0.1:19090
    server s2 127.0.0.1:19091
    server s3 127.0.0.1:19092
    server s4 127.0.0.1:19093
    server s5 127.0.0.1:19094
    server s6 127.0.0.1:19095
    server s7 127.0.0.1:19096
    server s8 127.0.0.1:19097
backend be8lc
    balance leastconn
    http-reuse always
    server s1 127.0.0.1:19090
    server s2 127.0.0.1:19091
    server s3 127.0.0.1:19092
    server s4 127.0.0.1:19093
    server s5 127.0.0.1:19094
    server s6 127.0.0.1:19095
    server s7 127.0.0.1:19096
    server s8 127.0.0.1:19097
