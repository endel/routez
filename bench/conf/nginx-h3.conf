# nginx for the HTTP/3 suite: h3 on UDP :19543, HTTP/1.1 over TLS on :19443 so
# the same client measures both.
worker_processes WORKERS;
daemon off;
pid RUN/nginx.pid;
error_log stderr error;
worker_rlimit_nofile 1048576;
events { worker_connections 65536; }
http {
    access_log off;
    default_type text/plain;
    sendfile on;
    keepalive_requests 100000;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 1s;
    open_file_cache_errors on;

    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve X25519;
    ssl_certificate CERTS/server.crt;
    ssl_certificate_key CERTS/server.key;

    upstream be { server 127.0.0.1:19090; keepalive 64; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 127.0.0.1:19543 quic reuseport;
        listen 127.0.0.1:19443 ssl reuseport;
        http3 on;
        # Send many datagrams per syscall, as routez and HAProxy do.
        quic_gso on;
        root WWW;
        location = /ping { return 200 "pong"; }
        location /up/ { proxy_pass http://be; }
    }
}
