# nginx for the hostile suite: two upstreams (for the failover row), an RSA
# certificate beside the ECDSA one, and a rate limit keyed on a header so one
# client can be abusive while another stays polite.
worker_processes WORKERS;
daemon off;
pid RUN/nginx.pid;
error_log stderr error;
worker_rlimit_nofile 1048576;
events { worker_connections 65536; }
http {
    access_log off;
    default_type text/plain;
    sendfile on;
    keepalive_requests 100000;
    limit_req_zone $http_x_client zone=lr:16m rate=100r/s;

    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve X25519;
    ssl_certificate CERTS/server.crt;
    ssl_certificate_key CERTS/server.key;

    # :19102 is a backend of its own, so the failover row can kill it without
    # taking the shared one down.
    upstream be { server 127.0.0.1:19090; server 127.0.0.1:19102; keepalive 64; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 127.0.0.1:19080 reuseport;
        listen 127.0.0.1:19443 ssl reuseport;
        root WWW;
        location = /ping { return 200 "pong"; }
        location /up/ { proxy_pass http://be; }
        location /lr/ { limit_req zone=lr burst=10 nodelay; return 200 "pong"; }
    }
    server {
        listen 127.0.0.1:19484 ssl reuseport;
        ssl_certificate RUN/rsa.crt;
        ssl_certificate_key RUN/rsa.key;
        location = /ping { return 200 "pong"; }
    }
}
