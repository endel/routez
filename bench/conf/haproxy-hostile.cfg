# HAProxy for the hostile suite: two upstreams (for the failover row), an RSA
# certificate beside the ECDSA one, and a rate limit keyed on a header.
# Resumption is left on everywhere: the handshake rows use a client that never
# offers a session, so every server does a full handshake.
global
    nbthread WORKERS
    maxconn 200000
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-curves X25519

defaults
    mode http
    timeout connect 5s
    timeout client 75s
    timeout server 60s
    timeout http-keep-alive 75s
    timeout http-request 30s
    no log

frontend fe
    bind 127.0.0.1:19082 shards by-thread
    bind 127.0.0.1:19445 ssl crt RUN/server.pem alpn http/1.1 shards by-thread
    bind 127.0.0.1:19486 ssl crt RUN/rsa.pem alpn http/1.1 shards by-thread


    stick-table type string len 64 size 1m expire 10s store http_req_rate(1s)
    http-request track-sc0 req.hdr(x-client) if { path_beg /lr/ }
    http-request deny deny_status 429 if { path_beg /lr/ } { sc_http_req_rate(0) gt 100 }

    http-request return status 200 content-type text/plain string pong if { path /ping }
    http-request return status 200 content-type text/plain string pong if { path_beg /lr/ }
    use_backend be if { path_beg /up/ }

backend be
    http-reuse always
    server s1 127.0.0.1:19090
    # Killed by the failover row; the shared backend stays up.
    server s2 127.0.0.1:19102
