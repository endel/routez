# HAProxy for the layer-4 suite: mode tcp on :19282, with splice on so the
# kernel moves the bytes. It has no generic UDP proxy, so it sits out those rows.
global
    nbthread WORKERS
    maxconn 200000
    tune.pipesize 262144

defaults
    mode tcp
    timeout connect 5s
    timeout client 75s
    timeout server 60s
    no log

listen l4
    bind 127.0.0.1:19282 shards by-thread
    option splice-request
    option splice-response
    server up 127.0.0.1:19090
