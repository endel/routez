# nginx under test: plain on :19080, TLS on :19443. Given its best settings, so
# a row it loses isn't a row it was misconfigured for.
worker_processes WORKERS;
daemon off;
pid RUN/nginx.pid;
error_log stderr error;
worker_rlimit_nofile 1048576;
events { worker_connections 65536; }
http {
    access_log ACCESS_LOG;
    default_type text/plain;
    sendfile on;
    # The default of 1000 would make nginx alone pay for reconnects.
    keepalive_requests 100000;
    # Off by default; routez caches open files always, so match its defaults.
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 1s;
    open_file_cache_errors on;
    # Far above the offered load: the row measures the check, not the limit.
    limit_req_zone $binary_remote_addr zone=lr:16m rate=1000000r/s;

    # What quic-zig's TLS server picks by its own preference; unpinned,
    # OpenSSL follows wrk's order and picks AES-256-GCM.
    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve X25519;
    ssl_certificate CERTS/server.crt;
    ssl_certificate_key CERTS/server.key;

    upstream be    { server 127.0.0.1:19090; keepalive 64; }
    upstream be1m  { server 127.0.0.1:19099; keepalive 64; }
    upstream bez   { server 127.0.0.1:19100; keepalive 64; }
    upstream betls { server 127.0.0.1:19098; keepalive 64; }
    # No keepalive: a connection per request, spread over eight addresses so the
    # row measures the server and not the ephemeral port range.
    upstream benk {
        server 127.0.0.1:19101; server 127.0.0.2:19101; server 127.0.0.3:19101; server 127.0.0.4:19101;
        server 127.0.0.5:19101; server 127.0.0.6:19101; server 127.0.0.7:19101; server 127.0.0.8:19101;
    }
    upstream be8 {
        server 127.0.0.1:19090; server 127.0.0.1:19091; server 127.0.0.1:19092; server 127.0.0.1:19093;
        server 127.0.0.1:19094; server 127.0.0.1:19095; server 127.0.0.1:19096; server 127.0.0.1:19097;
        keepalive 64;
    }
    upstream be8lc {
        least_conn;
        server 127.0.0.1:19090; server 127.0.0.1:19091; server 127.0.0.1:19092; server 127.0.0.1:19093;
        server 127.0.0.1:19094; server 127.0.0.1:19095; server 127.0.0.1:19096; server 127.0.0.1:19097;
        keepalive 64;
    }
    # Every proxied row but the no-keepalive one reuses upstream connections.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 127.0.0.1:19080 reuseport;
        listen 127.0.0.1:19443 ssl reuseport;
        root WWW;
        location = /ping { return 200 "pong"; }
        location /up/    { proxy_pass http://be; }
        location /up1m/  { proxy_pass http://be1m; }
        location /ups/   { proxy_pass https://betls; }
        location /up8/   { proxy_pass http://be8; }
        location /up8lc/ { proxy_pass http://be8lc; }
        location /nk/    { proxy_pass http://benk; proxy_http_version 1.0; proxy_set_header Connection close; }
        location /upz/ {
            proxy_pass http://bez;
            gzip on;
            gzip_min_length 1024;
            gzip_comp_level 4;
            gzip_proxied any;
        }
        # Compression rows only, so the other static rows stay uncompressed.
        # Level 4 is what routez's encoder uses.
        location /z/ {
            gzip on;
            gzip_static on;
            gzip_min_length 1024;
            gzip_comp_level 4;
        }
        # What a feature costs when it is on but never fires.
        location /lr/  { limit_req zone=lr burst=1000 nodelay; return 200 "pong"; }
        location /acl/ { allow 127.0.0.0/8; deny all; return 200 "pong"; }
        location /rw/  { rewrite ^/rw/(.*)$ /ping last; }
        # ROUTING
    }
}
