# nginx for the layer-4 suite: stream, not http. TCP :19280 and UDP :19290 both
# forward without looking inside.
worker_processes WORKERS;
daemon off;
pid RUN/nginx.pid;
error_log stderr error;
worker_rlimit_nofile 1048576;
events { worker_connections 65536; }
stream {
    server {
        listen 127.0.0.1:19280 reuseport;
        proxy_pass 127.0.0.1:19090;
    }
    server {
        listen 127.0.0.1:19290 udp reuseport;
        proxy_pass 127.0.0.1:19201;
        # One upstream socket per client flow, as the others do.
        proxy_responses 1;
        proxy_timeout 60s;
    }
}
